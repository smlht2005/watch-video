<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'WenQuanYi Zen Hei','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
<rect width="1600" height="900" fill="#0f172a"/>
<text x="800" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#f8fafc">獨立知識流程：歸檔 → 人確認 → Obsidian 知識庫</text>
<text x="800" y="84" text-anchor="middle" font-size="18" fill="#94a3b8">腳本自動（藍）｜Claude 草擬（橘）｜使用者確認（金）｜交付（綠）｜來源（灰）</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="150" y="118" text-anchor="middle" font-size="16" fill="#cbd5e1">① 取得內容</text>
<rect x="30" y="130" width="250" height="100" rx="12" fill="#334155"/><text x="155.0" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#f8fafc">影片網址</text><text x="155.0" y="184" text-anchor="middle" font-size="15" fill="#e2e8f0">yt-dlp＋Whisper 轉錄</text><text x="155.0" y="206" text-anchor="middle" font-size="15" fill="#e2e8f0">＋截圖</text>
<rect x="30" y="250" width="250" height="100" rx="12" fill="#334155"/><text x="155.0" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#f8fafc">Threads 圖文網址</text><text x="155.0" y="304" text-anchor="middle" font-size="15" fill="#e2e8f0">自動抓本文＋全部頁面圖</text><text x="155.0" y="326" text-anchor="middle" font-size="15" fill="#e2e8f0">（/embed，只讀公開頁）</text>
<rect x="30" y="370" width="250" height="100" rx="12" fill="#334155"/><text x="155.0" y="398" text-anchor="middle" font-size="20" font-weight="bold" fill="#f8fafc">使用者上傳圖片</text><text x="155.0" y="424" text-anchor="middle" font-size="15" fill="#e2e8f0">其他平台／抓取失敗</text><text x="155.0" y="446" text-anchor="middle" font-size="15" fill="#e2e8f0">→ 手動 carousel 流程</text>
<text x="465" y="118" text-anchor="middle" font-size="16" fill="#cbd5e1">② 歸檔資料夾</text>
<rect x="330" y="130" width="270" height="340" rx="12" fill="#1e3a8a"/><text x="465.0" y="158" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8fafc">watch-output/&lt;領域&gt;/&lt;資料夾&gt;/</text><text x="465.0" y="184" text-anchor="middle" font-size="15" fill="#e2e8f0">meta.json</text><text x="465.0" y="206" text-anchor="middle" font-size="15" fill="#e2e8f0">transcript.md（影片：語音；</text><text x="465.0" y="228" text-anchor="middle" font-size="15" fill="#e2e8f0">圖文：逐頁抄錄）</text><text x="465.0" y="250" text-anchor="middle" font-size="15" fill="#e2e8f0">frames/（原圖唯一存放處）</text><text x="465.0" y="272" text-anchor="middle" font-size="15" fill="#e2e8f0">summary.md／mindmap.md</text><text x="465.0" y="294" text-anchor="middle" font-size="15" fill="#e2e8f0">supplement.md（貼文本文）</text><text x="465.0" y="316" text-anchor="middle" font-size="15" fill="#e2e8f0">報告 report.docx／.md</text><text x="465.0" y="338" text-anchor="middle" font-size="15" fill="#e2e8f0"></text><text x="465.0" y="360" text-anchor="middle" font-size="15" fill="#e2e8f0">可選手寫檔（重跑不覆蓋）：</text><text x="465.0" y="382" text-anchor="middle" font-size="15" fill="#e2e8f0">links.md　knowledge.md</text>
<text x="785" y="118" text-anchor="middle" font-size="16" fill="#cbd5e1">③ Claude 草擬（只寫候選）</text>
<rect x="650" y="130" width="270" height="90" rx="12" fill="#9a3412"/><text x="785.0" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#f8fafc">4a／4b 摘要＋思維導圖</text><text x="785.0" y="184" text-anchor="middle" font-size="15" fill="#e2e8f0">看圖／讀逐字稿、標主張未查證</text>
<rect x="650" y="240" width="270" height="105" rx="12" fill="#9a3412"/><text x="785.0" y="268" text-anchor="middle" font-size="20" font-weight="bold" fill="#f8fafc">4e 候選連結 links.md</text><text x="785.0" y="294" text-anchor="middle" font-size="15" fill="#e2e8f0">[[概念]]｜關係類型：說明</text><text x="785.0" y="316" text-anchor="middle" font-size="15" fill="#e2e8f0">缺關係說明＝拒絕</text>
<rect x="650" y="365" width="270" height="105" rx="12" fill="#9a3412"/><text x="785.0" y="393" text-anchor="middle" font-size="20" font-weight="bold" fill="#f8fafc">4f 候選知識點 knowledge.md</text><text x="785.0" y="419" text-anchor="middle" font-size="15" fill="#e2e8f0">出處（頁／時間）＋原文引文</text><text x="785.0" y="441" text-anchor="middle" font-size="15" fill="#e2e8f0">＋說明＋標示</text>
<text x="1085" y="118" text-anchor="middle" font-size="16" fill="#cbd5e1">④ 使用者確認</text>
<rect x="970" y="240" width="230" height="230" rx="12" fill="#854d0e"/><text x="1085.0" y="268" text-anchor="middle" font-size="19" font-weight="bold" fill="#f8fafc">人的閘門</text><text x="1085.0" y="294" text-anchor="middle" font-size="15" fill="#e2e8f0">逐條確認或刪改</text><text x="1085.0" y="316" text-anchor="middle" font-size="15" fill="#e2e8f0"></text><text x="1085.0" y="338" text-anchor="middle" font-size="15" fill="#e2e8f0">確認 → 移到「## 已確認」</text><text x="1085.0" y="360" text-anchor="middle" font-size="15" fill="#e2e8f0"></text><text x="1085.0" y="382" text-anchor="middle" font-size="15" fill="#e2e8f0">沒有分區標題</text><text x="1085.0" y="404" text-anchor="middle" font-size="15" fill="#e2e8f0">＝整份當候選</text>
<text x="1405" y="118" text-anchor="middle" font-size="16" fill="#cbd5e1">⑤ 匯出腳本（只取已確認）</text>
<rect x="1250" y="130" width="320" height="340" rx="12" fill="#1e3a8a"/><text x="1410.0" y="158" text-anchor="middle" font-size="19" font-weight="bold" fill="#f8fafc">obsidian_export.py</text><text x="1410.0" y="184" text-anchor="middle" font-size="15" fill="#e2e8f0">連結：只取已確認，不靠相似度</text><text x="1410.0" y="206" text-anchor="middle" font-size="15" fill="#e2e8f0">出處連結：機械自動產生</text><text x="1410.0" y="228" text-anchor="middle" font-size="15" fill="#e2e8f0">警告：候選未匯出／引文找不到</text><text x="1410.0" y="250" text-anchor="middle" font-size="15" fill="#e2e8f0">　　　連結缺關係／標題重複</text><text x="1410.0" y="272" text-anchor="middle" font-size="15" fill="#e2e8f0"></text><text x="1410.0" y="294" text-anchor="middle" font-size="15" fill="#e2e8f0">狀態：有已確認項目→reviewed</text><text x="1410.0" y="316" text-anchor="middle" font-size="15" fill="#e2e8f0">重匯只覆蓋 generated_by 標記</text><text x="1410.0" y="338" text-anchor="middle" font-size="15" fill="#e2e8f0">　且 video_id 相符的檔案</text><text x="1410.0" y="360" text-anchor="middle" font-size="15" fill="#e2e8f0"></text><text x="1410.0" y="382" text-anchor="middle" font-size="15" fill="#e2e8f0">--with-pages：全部頁面圖</text><text x="1410.0" y="404" text-anchor="middle" font-size="15" fill="#e2e8f0">--vault：只進 watch-archive/</text>
