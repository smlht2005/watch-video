<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'WenQuanYi Zen Hei','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
<rect width="1600" height="900" fill="#0f172a"/>
<text x="800" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#f8fafc">watch-archive 全流程鳥瞰：影片網址 → 圖文報告</text>
<text x="800" y="84" text-anchor="middle" font-size="18" fill="#94a3b8">腳本自動（藍）｜Claude 人工判斷（橘）｜交付（綠）</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#a)">
<path d="M270,200 H320"/><path d="M590,200 H640"/><path d="M910,200 H960"/><path d="M1230,200 H1280"/>
<path d="M1445,275 V325"/>
<path d="M1315,400 H1285"/><path d="M1025,400 H995"/><path d="M735,400 H705"/><path d="M445,400 H415"/>
<path d="M285,475 V610 H345"/><path d="M620,610 H665"/>
</g>
<path d="M1425,130 V117 H775 V126" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/><text x="1100" y="112" text-anchor="middle" font-size="14" fill="#fbbf24">截圖不足：補 --timestamps --resolution 1024 重跑（slides 圖檔依時間自動對應）</text>
<path d="M1095,270 V292 H790 V280" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/><text x="942" y="312" text-anchor="middle" font-size="14" fill="#fbbf24">語言錯／整段漏轉：加 --lang 或改 Groq 重跑（先保存舊稿，缺漏互補）</text>
<g font-size="20" fill="#f8fafc">
<!-- row 1 -->
<rect x="30" y="130" width="240" height="140" rx="14" fill="#1e3a8a"/><text x="150" y="165" text-anchor="middle" font-weight="bold" font-size="22">0 環境</text><text x="150" y="198" text-anchor="middle" font-size="15">Groq key 或 WhisperX（只報長度）</text><text x="150" y="224" text-anchor="middle" font-size="16">Windows：PYTHONUTF8=1</text><text x="150" y="250" text-anchor="middle" font-size="17">開新 claude/... 分支</text>
<rect x="320" y="130" width="270" height="140" rx="14" fill="#9a3412"/><text x="455" y="165" text-anchor="middle" font-weight="bold" font-size="22">1 選參數</text><text x="455" y="198" text-anchor="middle" font-size="17">不強制 --lang（自動偵測）</text><text x="455" y="224" text-anchor="middle" font-size="15">--glossary --title --terms --local</text><text x="455" y="250" text-anchor="middle" font-size="14">長錄影：--timestamps／--resolution</text>
<rect x="640" y="130" width="270" height="140" rx="14" fill="#1e3a8a"/><text x="775" y="165" text-anchor="middle" font-weight="bold" font-size="22">2 歸檔 watch_archive.py</text><text x="775" y="198" text-anchor="middle" font-size="16">下載 → 字幕或 Groq／WhisperX</text><text x="775" y="224" text-anchor="middle" font-size="16">語言：Whisper 回報／文字判斷</text><text x="775" y="250" text-anchor="middle" font-size="16">中文轉繁體 → 詞典 → 截圖</text>
<rect x="960" y="130" width="270" height="140" rx="14" fill="#9a3412"/><text x="1095" y="165" text-anchor="middle" font-weight="bold" font-size="22">3 校稿</text><text x="1095" y="198" text-anchor="middle" font-size="16">先驗收：語言／30 秒缺漏／幻覺</text><text x="1095" y="224" text-anchor="middle" font-size="16">通讀 transcript.md</text><text x="1095" y="250" text-anchor="middle" font-size="16">對照畫面字幕、投影片、講稿</text>
<rect x="1280" y="130" width="290" height="140" rx="14" fill="#9a3412"/><text x="1425" y="165" text-anchor="middle" font-weight="bold" font-size="21">4a 看截圖分投影片或主題</text><text x="1425" y="198" text-anchor="middle" font-size="17">合併零碎畫面 → slides（段落）</text><text x="1425" y="224" text-anchor="middle" font-size="15">每段選乾淨投影片（避開講者交疊）</text><text x="1425" y="250" text-anchor="middle" font-size="15">每段 2–4 分鐘；圖不夠→補 cue 重跑</text>
<!-- row 2 (right to left) -->
<rect x="1320" y="330" width="250" height="140" rx="14" fill="#9a3412"/><text x="1445" y="365" text-anchor="middle" font-weight="bold" font-size="22">4b 補內容</text><text x="1445" y="398" text-anchor="middle" font-size="16">summary.md 摘要／名詞</text><text x="1445" y="424" text-anchor="middle" font-size="16">keywords／asr_errors／詞典</text><text x="1445" y="450" text-anchor="middle" font-size="16">非中文 → transcript.zh.md</text>
<rect x="1030" y="330" width="250" height="140" rx="14" fill="#9a3412"/><text x="1155" y="365" text-anchor="middle" font-weight="bold" font-size="22">4c 補充資料（選用）</text><text x="1155" y="398" text-anchor="middle" font-size="16">supplement.md（獨立檔）</text><text x="1155" y="424" text-anchor="middle" font-size="16">畫面遺漏／貼文／原講稿二次校對</text><text x="1155" y="450" text-anchor="middle" font-size="16">原文逐字＋與影片對照</text>
<rect x="740" y="330" width="250" height="140" rx="14" fill="#1e3a8a"/><text x="865" y="365" text-anchor="middle" font-weight="bold" font-size="22">5 重建報告</text><text x="865" y="398" text-anchor="middle" font-size="16">build_report.py</text><text x="865" y="424" text-anchor="middle" font-size="16">slides → 一段一圖＋中譯</text><text x="865" y="450" text-anchor="middle" font-size="16">有補充檔 → 補充章節＋連結</text>
<rect x="450" y="330" width="250" height="140" rx="14" fill="#9a3412"/><text x="575" y="365" text-anchor="middle" font-weight="bold" font-size="22">5b 目視檢查</text><text x="575" y="398" text-anchor="middle" font-size="16">docx → PDF → 看圖</text><text x="575" y="424" text-anchor="middle" font-size="16">中文／截圖／頁數</text>
<rect x="160" y="330" width="250" height="140" rx="14" fill="#166534"/><text x="285" y="365" text-anchor="middle" font-weight="bold" font-size="22">6 交付</text><text x="285" y="398" text-anchor="middle" font-size="16">SendUserFile *.docx</text><text x="285" y="424" text-anchor="middle" font-size="16">說明逐字稿來源與語言</text>
<!-- row 3 -->
<rect x="350" y="540" width="270" height="140" rx="14" fill="#166534"/><text x="485" y="575" text-anchor="middle" font-weight="bold" font-size="22">7 提交</text><text x="485" y="608" text-anchor="middle" font-size="17">commit + push 指定分支</text><text x="485" y="634" text-anchor="middle" font-size="17">合併方式依使用者指示</text>
</g>
<!-- output box -->
<rect x="670" y="520" width="900" height="180" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
<text x="700" y="555" font-size="20" font-weight="bold" fill="#f8fafc">watch-output/&lt;日期&gt;_&lt;平台&gt;_&lt;標題&gt;__&lt;影片ID&gt;/</text>
<g font-size="17" fill="#cbd5e1">
<text x="700" y="590">meta.json（slides／asr_errors／cue_timestamps 重跑保留；語言每次重新判斷）</text>
<text x="700" y="618">transcript.md（繁體校正）＋ .raw.md ＋ .zh.md（非中文必做，重跑保留）</text>
<text x="700" y="646">frames/ ＋ frames.json　summary.md　supplement.md（選用，重跑保留）</text>
<text x="700" y="674">*_report.docx ／ .md：摘要 → 補充資料 → 圖文對照 → 錯誤表 → 補充連結</text>
</g>
<!-- bottom rules -->
<rect x="30" y="712" width="1540" height="180" rx="14" fill="#111c33" stroke="#334155" stroke-width="2"/>
<text x="55" y="742" font-size="20" font-weight="bold" fill="#f8fafc">守則</text>
<g font-size="17" fill="#cbd5e1">
<text x="55" y="770">• 不印出 API key　• 預設不強制 --lang，先自動偵測語言；強制語言會把外語硬轉成該語言（腳本會警告）</text>
<text x="55" y="796">• 已知非中文語言 → 一律寫繁中 transcript.zh.md　• 穩定的校正進領域詞典，不確定的進 known_asr_errors</text>
<text x="55" y="822">• 先合併成投影片／主題段落（每段 2–4 分鐘），長錄影在主題轉換點補 --timestamps 截圖　• 影片沒呈現的資訊放 supplement.md，並更新原本的推測</text>
<text x="55" y="848">• 同一影片 ID 只一個資料夾，重跑 = 更新　• 失敗回報類別（網路／下載／轉錄／權限）　• 他人影片不入庫　• YouTube 擋下載：Windows 用 Firefox cookies</text>
<text x="55" y="874">• WhisperX 自動偵測語言不可靠（曾把中文講座翻成日文）　• Groq 長音訊偶爾整段 30 秒漏轉（已自動補漏）、或把提示詞當成逐字稿吐出　• 有原講稿時拿來二次校對</text>
</g>
</svg>
